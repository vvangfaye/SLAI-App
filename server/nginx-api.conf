# slai-api.wangfaye.cn public entry on aliyun1.
# Install the matching certificate and key before enabling this file.
# The existing slai-relay service and FRP gateway remain unchanged.
server {
    listen 80;
    server_name slai-api.wangfaye.cn;
    access_log off;
    error_log /dev/null crit;

    return 404;
}

server {
    listen 443 ssl;
    server_name slai-api.wangfaye.cn;
    ssl_certificate /etc/nginx/ssl/slai-api.wangfaye.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/slai-api.wangfaye.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null crit;

    include /etc/nginx/snippets/slai-relay.conf;
    location / { return 404; }
}
